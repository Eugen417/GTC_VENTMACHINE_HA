name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package gtc_ventmachine.zip
        run: |
          cd custom_components/gtc_ventmachine
          zip -r "${GITHUB_WORKSPACE}/gtc_ventmachine.zip" . -x "*/__pycache__/*" "*.pyc" "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gtc_ventmachine.zip
          generate_release_notes: true
